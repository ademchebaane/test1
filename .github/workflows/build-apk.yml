name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Locate source files
        shell: bash
        run: |
          set -euo pipefail

          find_file() {
            find . \
              -path './.git' -prune -o \
              -path './.github' -prune -o \
              -type f -name "$1" -print -quit
          }

          MAIN="$(find_file MainActivity.java)"
          HTML="$(find_file index.html)"
          MANIFEST="$(find_file AndroidManifest.xml)"

          [[ -n "$MAIN" ]] || { echo "ERROR: MainActivity.java not found"; exit 1; }
          [[ -n "$HTML" ]] || { echo "ERROR: index.html not found"; exit 1; }
          [[ -n "$MANIFEST" ]] || { echo "ERROR: AndroidManifest.xml not found"; exit 1; }

          echo "MAIN=$MAIN" >> "$GITHUB_ENV"
          echo "HTML=$HTML" >> "$GITHUB_ENV"
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"

          echo "Found source files:"
          echo "  MainActivity.java : $MAIN"
          echo "  index.html        : $HTML"
          echo "  AndroidManifest   : $MANIFEST"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app
          mkdir -p app/src/main/java/com/example/flatapp
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          cp "$MAIN" app/src/main/java/com/example/flatapp/MainActivity.java
          cp "$HTML" app/src/main/assets/index.html
          cp "$MANIFEST" app/src/main/AndroidManifest.xml

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.flatapp'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.flatapp'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: flat-apk-app
          path: app/build/outputs/apk/debug/app-debug.apk
